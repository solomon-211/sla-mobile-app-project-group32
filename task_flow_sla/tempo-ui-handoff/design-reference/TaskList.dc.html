<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tempo · Task List</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B2E2D}a:hover{color:#000}
.scroll{scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.stretch::after{content:"";position:absolute;inset:0;border-radius:24px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #E6E8E7; font-family: Manrope, sans-serif; color: #2B2E2D">
<div class="scroll" style="position: absolute; inset: 0; overflow-y: auto; padding: 20px 16px 120px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">

<header style="display: flex; align-items: center; justify-content: space-between">
<button aria-label="Open menu" style="width: 46px; height: 46px; border-radius: 50%; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B2E2D" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h10M4 17h16"></path></svg>
</button>
<button aria-label="Sort by deadline" style="width: 46px; height: 46px; border-radius: 50%; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B2E2D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"></path></svg>
</button>
</header>

<div style="display: flex; align-items: flex-end; justify-content: space-between; padding: 0 4px">
<h1 style="margin: 0; font-family: Sora, sans-serif; font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -1.2px">Tasks</h1>
<span style="font-size: 14px; font-weight: 700; color: #535856; padding-bottom: 6px">21 total</span>
</div>

<div style="display: flex; gap: 10px">
<label style="flex: 1; display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 18px; border-radius: 999px; background: #FFFFFF; box-sizing: border-box">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#535856" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4-4"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search tasks</span>
<input type="search" placeholder="Search tasks..." value="{{query}}" onChange="{{onSearch}}" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: 600 15px Manrope, sans-serif; color: #2B2E2D">
</label>
<button aria-label="More filters" style="width: 54px; height: 54px; border-radius: 50%; border: 0; background: #2B2E2D; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6F8F5E" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"></path></svg>
</button>
</div>

<div class="scroll" role="group" aria-label="Filter by SLA status" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
<button onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="flex-shrink: 0; height: 44px; padding: 0 18px; border-radius: 999px; border: 0; background: {{c.bg}}; color: {{c.fg}}; font: 800 14px Manrope, sans-serif; cursor: pointer; display: flex; align-items: center; gap: 8px">
<span style="width: 8px; height: 8px; border-radius: 50%; background: {{c.dot}}"></span>{{c.label}}
</button>
</sc-for>
</div>

<sc-if value="{{hasNeed}}" hint-placeholder-val="{{ true }}">
<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 6px 4px 0; font-size: 13px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: #9A2A10; display: flex; align-items: center; gap: 8px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #D9785F"></span>Needs attention · {{needCount}}</h2>
<sc-for list="{{need}}" as="t" hint-placeholder-count="3">
<div style="position: relative; display: flex; gap: 12px; padding: 16px; border-radius: 24px; background: {{t.bg}}; color: {{t.fg}}">
<div style="width: 44px; height: 44px; border-radius: 50%; background: {{t.avBg}}; color: {{t.avFg}}; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; flex-shrink: 0">{{t.who}}</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<a href="TaskDetails.dc.html" class="stretch" style="font-size: 16px; font-weight: 800; color: {{t.fg}}; text-decoration: none; line-height: 21px">{{t.title}}</a>
<span style="font-size: 13px; font-weight: 600; color: {{t.sub}}">{{t.meta}}</span>
<span style="align-self: flex-start; margin-top: 6px; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: {{t.chipBg}}; font-size: 12px; font-weight: 700">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>{{t.due}}</span>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between">
<button aria-label="Task options" style="position: relative; z-index: 1; width: 44px; height: 44px; margin: -10px -10px 0 0; border: 0; border-radius: 50%; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="{{t.fg}}"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg>
</button>
<span style="padding: 6px 12px; border-radius: 999px; background: {{t.badgeBg}}; color: {{t.badgeFg}}; font-size: 12px; font-weight: 800; white-space: nowrap">{{t.sla}}</span>
</div>
</div>
</sc-for>
</section>
</sc-if>

<sc-if value="{{hasUp}}" hint-placeholder-val="{{ true }}">
<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 6px 4px 0; font-size: 13px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: #3E5534; display: flex; align-items: center; gap: 8px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #56734A"></span>Upcoming · {{upCount}}</h2>
<sc-for list="{{up}}" as="t" hint-placeholder-count="1">
<div style="position: relative; display: flex; gap: 12px; padding: 16px; border-radius: 24px; background: {{t.bg}}; color: {{t.fg}}">
<div style="width: 44px; height: 44px; border-radius: 50%; background: {{t.avBg}}; color: {{t.avFg}}; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; flex-shrink: 0">{{t.who}}</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<a href="TaskDetails.dc.html" class="stretch" style="font-size: 16px; font-weight: 800; color: {{t.fg}}; text-decoration: none; line-height: 21px">{{t.title}}</a>
<span style="font-size: 13px; font-weight: 600; color: {{t.sub}}">{{t.meta}}</span>
<span style="align-self: flex-start; margin-top: 6px; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: {{t.chipBg}}; font-size: 12px; font-weight: 700">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>{{t.due}}</span>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between">
<button aria-label="Task options" style="position: relative; z-index: 1; width: 44px; height: 44px; margin: -10px -10px 0 0; border: 0; border-radius: 50%; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="{{t.fg}}"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg>
</button>
<span style="padding: 6px 12px; border-radius: 999px; background: {{t.badgeBg}}; color: {{t.badgeFg}}; font-size: 12px; font-weight: 800; white-space: nowrap">{{t.sla}}</span>
</div>
</div>
</sc-for>
</section>
</sc-if>

<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="padding: 40px 24px; border-radius: 24px; background: #FFFFFF; text-align: center; display: flex; flex-direction: column; gap: 6px">
<span style="font-family: Sora, sans-serif; font-size: 18px; font-weight: 700">Nothing here</span>
<span style="font-size: 14px; color: #535856; font-weight: 500">No tasks match this filter.</span>
</div>
</sc-if>
</div>

<a href="CreateTask.dc.html" aria-label="Create task" style="position: absolute; right: 20px; bottom: 104px; width: 62px; height: 62px; border-radius: 50%; background: #6F8F5E; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(18,21,18,.25)">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2B2E2D" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</a>

<nav aria-label="Main" style="position: absolute; left: 16px; right: 16px; bottom: 16px; height: 72px; border-radius: 999px; background: #2B2E2D; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; box-shadow: 0 12px 30px rgba(18,21,18,.25)">
<a href="Dashboard.dc.html" aria-label="Home" style="width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#CDD1CF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg></a>
<a href="TaskList.dc.html" aria-current="page" style="height: 52px; padding: 0 20px 0 16px; border-radius: 999px; background: #6F8F5E; color: #121A0D; display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#121A0D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"></rect><path d="M8 9l2 2 4-4M8 16h8"></path></svg>Tasks</a>
<button aria-label="Stats" style="width: 52px; height: 52px; border-radius: 50%; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#CDD1CF" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"></path></svg></button>
<a href="Team.dc.html" aria-label="Team" style="width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#CDD1CF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"></path></svg></a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all', query: '' };
  }
  renderVals() {
    const AV = {
      BO: ['#2B2E2D', '#F5F6F6'], AK: ['#6F8F5E', '#121A0D'],
      CM: ['#E6E8E7', '#2B2E2D'], DA: ['#C4C8C6', '#2B2E2D']
    };
    const BADGE = {
      overdue: ['Overdue', '#D9785F', '#2A0C04'],
      risk: ['At Risk', '#F1E2C2', '#5C3A00'],
      track: ['On Track', '#6F8F5E', '#121A0D'],
      done: ['Done', '#E6E8E7', '#2E3230']
    };
    const tasks = [
      { who: 'BO', title: 'Fix login token refresh', meta: 'Backend · High priority', due: '4 Oct 2026', s: 'overdue', group: 'need' },
      { who: 'AK', title: 'Write API error states', meta: 'Mobile · Medium priority', due: '6 Oct 2026', s: 'risk', group: 'need' },
      { who: 'CM', title: 'Design onboarding screens', meta: 'UI/UX · Medium priority', due: '6 Oct 2026', s: 'risk', group: 'need' },
      { who: 'DA', title: 'Set up CI for Android builds', meta: 'DevOps · Low priority', due: '12 Oct 2026', s: 'track', group: 'up' }
    ];
    const f = this.state.filter;
    const q = this.state.query.trim().toLowerCase();
    const shown = tasks
      .filter((t) => f === 'all' || t.s === f)
      .filter((t) => !q || t.title.toLowerCase().includes(q))
      .map((t) => {
        const dark = t.s === 'overdue';
        const b = BADGE[t.s];
        return {
          ...t,
          bg: dark ? '#2B2E2D' : '#FFFFFF',
          fg: dark ? '#F5F6F6' : '#2B2E2D',
          sub: dark ? '#A7ACAA' : '#535856',
          chipBg: dark ? '#353938' : '#F1F2F2',
          avBg: dark ? '#F5F6F6' : AV[t.who][0],
          avFg: dark ? '#2B2E2D' : AV[t.who][1],
          sla: b[0], badgeBg: b[1], badgeFg: b[2]
        };
      });
    const need = shown.filter((t) => t.group === 'need');
    const up = shown.filter((t) => t.group === 'up');
    const unfiltered = f === 'all' && !q;
    const chipDefs = [
      ['all', 'All (21)', '#2B2E2D'], ['track', 'On Track', '#56734A'],
      ['risk', 'At Risk', '#D9A441'], ['overdue', 'Overdue', '#D9785F'], ['done', 'Done', '#9DA2A0']
    ];
    const chips = chipDefs.map(([id, label, dot]) => {
      const on = f === id;
      return {
        label, on,
        bg: on ? '#2B2E2D' : '#FFFFFF',
        fg: on ? '#F5F6F6' : '#2B2E2D',
        dot: on ? '#6F8F5E' : dot,
        pick: () => this.setState({ filter: id })
      };
    });
    return {
      chips, need, up, query: this.state.query,
      onSearch: (e) => this.setState({ query: e.target.value }),
      hasNeed: need.length > 0, hasUp: up.length > 0,
      needCount: unfiltered ? 3 : need.length,
      upCount: unfiltered ? 5 : up.length,
      empty: need.length === 0 && up.length === 0
    };
  }
}
</script>
</body>
</html>
