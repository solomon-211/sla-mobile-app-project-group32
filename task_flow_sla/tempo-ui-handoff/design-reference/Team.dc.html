<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tempo · Team Members</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B2E2D}a:hover{color:#000}
.scroll{scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #E6E8E7; font-family: Manrope, sans-serif; color: #2B2E2D">
<div class="scroll" style="position: absolute; inset: 0; overflow-y: auto; padding: 20px 16px 116px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">

<header style="display: flex; align-items: center; justify-content: space-between">
<button aria-label="Open menu" style="width: 46px; height: 46px; border-radius: 50%; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B2E2D" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h10M4 17h16"></path></svg>
</button>
<button aria-label="Add member" style="height: 46px; padding: 0 16px 0 12px; border-radius: 999px; border: 0; background: #2B2E2D; color: #F5F6F6; display: flex; align-items: center; gap: 8px; font: 800 14px Manrope, sans-serif; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6F8F5E" stroke-width="2.2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0M19 8v6M16 11h6"></path></svg>Add
</button>
</header>

<h1 style="margin: 0; padding: 0 4px; font-family: Sora, sans-serif; font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -1.2px">Team Members</h1>

<!-- signed-in card -->
<section style="background: #2B2E2D; color: #F5F6F6; border-radius: 28px; padding: 18px; display: flex; flex-direction: column; gap: 16px; position: relative; overflow: hidden">
<div style="display: flex; align-items: center; gap: 14px">
<div style="width: 60px; height: 60px; border-radius: 50%; background: #6F8F5E; color: #121A0D; display: flex; align-items: center; justify-content: center; font-family: Sora, sans-serif; font-weight: 700; font-size: 20px; flex-shrink: 0">AK</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: Sora, sans-serif; font-size: 20px; font-weight: 700">Amina K.</span>
<span style="font-size: 13px; font-weight: 600; color: #A7ACAA">Project Manager</span>
<span style="font-size: 13px; font-weight: 600; color: #A7ACAA">amina@devteam.app</span>
</div>
<span style="align-self: flex-start; padding: 6px 10px; border-radius: 999px; background: #6F8F5E; color: #121A0D; font-size: 11px; font-weight: 800; display: flex; align-items: center; gap: 5px"><span style="width: 6px; height: 6px; border-radius: 50%; background: #121A0D"></span>Signed in</span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="background: #2E3231; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: Sora, sans-serif; font-size: 22px; font-weight: 700">6</span><span style="font-size: 12px; font-weight: 600; color: #A7ACAA">tasks</span></div>
<div style="background: #2E3231; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: Sora, sans-serif; font-size: 22px; font-weight: 700; color: #E3BF73">1</span><span style="font-size: 12px; font-weight: 600; color: #A7ACAA">at risk</span></div>
<div style="background: #2E3231; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: Sora, sans-serif; font-size: 22px; font-weight: 700; color: #6F8F5E">4</span><span style="font-size: 12px; font-weight: 600; color: #A7ACAA">done</span></div>
</div>
<div style="display: flex; gap: 10px">
<a href="Main.dc.html" style="flex: 1; height: 50px; border-radius: 999px; background: #F5F6F6; color: #2B2E2D; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; font-size: 14px; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2B2E2D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h13l-3-3M17 17H4l3 3"></path></svg>Switch user</a>
<a href="Main.dc.html" style="flex: 1; height: 50px; border-radius: 999px; border: 1.5px solid #E59C88; box-sizing: border-box; color: #E59C88; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; font-size: 14px; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E59C88" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"></path></svg>Sign out</a>
</div>
</section>

<div style="display: flex; justify-content: space-between; align-items: center; padding: 4px 4px 0">
<h2 style="margin: 0; font-size: 18px; font-weight: 800">Members (4)</h2>
<span style="font-size: 13px; font-weight: 700; color: #535856">21 tasks shared</span>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{members}}" as="m" hint-placeholder-count="4">
<div style="background: #FFFFFF; border-radius: 24px; padding: 14px 6px 14px 14px; display: flex; align-items: center; gap: 12px">
<div style="width: 48px; height: 48px; border-radius: 50%; background: {{m.avBg}}; color: {{m.avFg}}; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; flex-shrink: 0">{{m.init}}</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 6px">{{m.name}}<sc-if value="{{m.you}}" hint-placeholder-val="{{ false }}"><span style="padding: 2px 8px; border-radius: 999px; background: #2B2E2D; color: #6F8F5E; font-size: 11px; font-weight: 800">You</span></sc-if></span>
<span style="font-size: 13px; font-weight: 600; color: #535856">{{m.role}} · {{m.tasks}} tasks</span>
<span style="display: flex; gap: 6px; margin-top: 4px">
<span style="padding: 4px 10px; border-radius: 999px; background: {{m.sBg}}; color: {{m.sFg}}; font-size: 12px; font-weight: 800">{{m.sla}}</span>
<span style="padding: 4px 10px; border-radius: 999px; background: #E6E8E7; color: #2E3230; font-size: 12px; font-weight: 800">{{m.done}} done</span>
</span>
</div>
<button aria-label="Member options" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="#2B2E2D"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg>
</button>
</div>
</sc-for>
</div>
</div>

<nav aria-label="Main" style="position: absolute; left: 16px; right: 16px; bottom: 16px; height: 72px; border-radius: 999px; background: #2B2E2D; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; box-shadow: 0 12px 30px rgba(18,21,18,.25)">
<a href="Dashboard.dc.html" aria-label="Home" style="width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#CDD1CF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg></a>
<a href="TaskList.dc.html" aria-label="Tasks" style="width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#CDD1CF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"></rect><path d="M8 9l2 2 4-4M8 16h8"></path></svg></a>
<button aria-label="Stats" style="width: 52px; height: 52px; border-radius: 50%; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#CDD1CF" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"></path></svg></button>
<a href="Team.dc.html" aria-current="page" style="height: 52px; padding: 0 20px 0 16px; border-radius: 999px; background: #6F8F5E; color: #121A0D; display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#121A0D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"></path></svg>Team</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = {
      risk: ['#F1E2C2', '#5C3A00'], overdue: ['#D9785F', '#2A0C04'], track: ['#6F8F5E', '#121A0D']
    };
    const raw = [
      { init: 'AK', name: 'Amina K.', you: true, role: 'Project Manager', tasks: 6, sla: '1 at risk', s: 'risk', done: 4, av: ['#6F8F5E', '#121A0D'] },
      { init: 'BO', name: 'Brian O.', you: false, role: 'Backend Developer', tasks: 5, sla: '1 overdue', s: 'overdue', done: 3, av: ['#2B2E2D', '#F5F6F6'] },
      { init: 'CM', name: 'Chloé M.', you: false, role: 'UI/UX Designer', tasks: 6, sla: '1 at risk', s: 'risk', done: 3, av: ['#E6E8E7', '#2B2E2D'] },
      { init: 'DA', name: 'Deng A.', you: false, role: 'Mobile Developer', tasks: 4, sla: 'All on track', s: 'track', done: 3, av: ['#C4C8C6', '#2B2E2D'] }
    ];
    return {
      members: raw.map((m) => ({ ...m, avBg: m.av[0], avFg: m.av[1], sBg: S[m.s][0], sFg: S[m.s][1] }))
    };
  }
}
</script>
</body>
</html>
