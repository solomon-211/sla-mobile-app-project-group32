<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tempo · Create Task</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B2E2D}a:hover{color:#000}
.scroll{scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
input::placeholder,textarea::placeholder{color:#6E7371}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #E6E8E7; font-family: Manrope, sans-serif; color: #2B2E2D">
<div class="scroll" style="position: absolute; inset: 0; overflow-y: auto; padding: 20px 16px 112px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">

<header style="display: flex; align-items: center; gap: 14px">
<a href="TaskList.dc.html" aria-label="Back" style="width: 46px; height: 46px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B2E2D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<h1 style="margin: 0; font-family: Sora, sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -.8px">{{heading}}</h1>
</header>

<form style="display: flex; flex-direction: column; gap: 16px; margin: 0">

<!-- title -->
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="t-title" style="font-size: 13px; font-weight: 800; padding-left: 4px">Task title</label>
<input id="t-title" type="text" placeholder="Enter task title" value="{{title}}" onChange="{{onTitle}}" style="height: 58px; border-radius: 20px; border: 1.5px solid {{titleBorder}}; background: #FFFFFF; padding: 0 18px; box-sizing: border-box; font: 600 15px Manrope, sans-serif; color: #2B2E2D; outline: none">
<sc-if value="{{titleErr}}" hint-placeholder-val="{{ true }}">
<span style="display: flex; align-items: center; gap: 6px; padding-left: 4px; font-size: 13px; font-weight: 700; color: #B3361A">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B3361A" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>Title is required (3–60 characters)</span>
</sc-if>
</div>

<!-- description -->
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="t-desc" style="font-size: 13px; font-weight: 800; padding-left: 4px">Description</label>
<textarea id="t-desc" maxlength="300" placeholder="Enter task description" value="{{desc}}" onChange="{{onDesc}}" style="height: 104px; resize: none; border-radius: 20px; border: 1.5px solid transparent; background: #FFFFFF; padding: 16px 18px; box-sizing: border-box; font: 500 15px/22px Manrope, sans-serif; color: #2B2E2D; outline: none"></textarea>
<span style="align-self: flex-end; font-size: 12px; font-weight: 700; color: #535856; padding-right: 4px">{{descLen}}/300</span>
</div>

<!-- grouped details card -->
<div style="background: #FFFFFF; border-radius: 28px; padding: 8px 16px; display: flex; flex-direction: column">

<label style="display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid #E6E8E7">
<span style="width: 44px; height: 44px; border-radius: 50%; background: #6F8F5E; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#121A0D" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 800; color: #535856">Assign to</span>
<select value="{{assignee}}" onChange="{{onAssignee}}" style="border: 0; background: transparent; padding: 0; margin-left: -3px; font: 800 15px Manrope, sans-serif; color: #2B2E2D; cursor: pointer; outline: none">
<option>Chloé M. (UI designer)</option><option>Amina K. (Project manager)</option><option>Brian O. (Backend developer)</option><option>Deng A. (Mobile developer)</option>
</select>
</span>
</label>

<div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 0; border-bottom: 1px solid #E6E8E7">
<div style="display: flex; align-items: center; gap: 14px">
<span style="width: 44px; height: 44px; border-radius: 50%; background: {{dueTile}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{dueIcon}}" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 800; color: #535856">Due date</span>
<span style="font-size: 15px; font-weight: 800; color: {{dueColor}}">{{due}}</span>
</span>
<button type="button" aria-label="Pick due date and time" style="height: 44px; padding: 0 14px; border-radius: 999px; border: 0; background: #F1F2F2; font: 800 13px Manrope, sans-serif; color: #2B2E2D; cursor: pointer">Change</button>
</div>
<sc-if value="{{dueErr}}" hint-placeholder-val="{{ true }}">
<span style="display: flex; align-items: center; gap: 6px; padding-left: 58px; font-size: 13px; font-weight: 700; color: #B3361A">Due date must be in the future</span>
</sc-if>
</div>

<div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 0; border-bottom: 1px solid #E6E8E7">
<span style="font-size: 12px; font-weight: 800; color: #535856; display: flex; align-items: center; gap: 8px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#535856" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h11l-2 4 2 4H5"></path></svg>Priority</span>
<div role="radiogroup" aria-label="Priority" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 5px; border-radius: 999px; background: #F1F2F2">
<sc-for list="{{prios}}" as="p" hint-placeholder-count="3">
<button type="button" role="radio" aria-checked="{{p.on}}" onClick="{{p.pick}}" style="height: 44px; border-radius: 999px; border: 0; background: {{p.bg}}; color: {{p.fg}}; font: 800 14px Manrope, sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{p.dot}}"></span>{{p.label}}</button>
</sc-for>
</div>
</div>

<label style="display: flex; align-items: center; gap: 14px; padding: 12px 0">
<span style="width: 44px; height: 44px; border-radius: 50%; background: #2B2E2D; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6F8F5E" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 800; color: #535856">Status</span>
<select value="{{status}}" onChange="{{onStatus}}" style="border: 0; background: transparent; padding: 0; margin-left: -3px; font: 800 15px Manrope, sans-serif; color: #2B2E2D; cursor: pointer; outline: none">
<option>To Do</option><option>In Progress</option><option>Done</option>
</select>
</span>
</label>
</div>
</form>
</div>

<div style="position: absolute; left: 16px; right: 16px; bottom: 16px">
<a href="TaskList.dc.html" style="height: 64px; border-radius: 999px; background: #2B2E2D; color: #F5F6F6; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 26px; font-weight: 800; font-size: 16px; text-decoration: none; box-shadow: 0 12px 30px rgba(18,21,18,.25)">
{{cta}}
<span style="width: 48px; height: 48px; border-radius: 50%; background: #6F8F5E; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B2E2D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["create","edit"],"default":"create"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const edit = (props.mode ?? 'create') === 'edit';
    this.state = {
      title: edit ? 'Write API error states' : '',
      desc: edit ? 'Show clear messages for timeout, 401 and 500 responses on the payment screens, with a retry button where it is safe.' : '',
      prio: 'Medium',
      assignee: edit ? 'Amina K. (Project manager)' : 'Chloé M. (UI designer)',
      status: edit ? 'In Progress' : 'To Do'
    };
  }
  renderVals() {
    const edit = (this.props.mode ?? 'create') === 'edit';
    const len = this.state.title.trim().length;
    const titleErr = len < 3 || len > 60;
    const dueErr = !edit;
    const P = { Low: '#56734A', Medium: '#D9A441', High: '#D9785F' };
    const prios = ['Low', 'Medium', 'High'].map((label) => {
      const on = this.state.prio === label;
      return {
        label, on,
        bg: on ? '#2B2E2D' : 'transparent',
        fg: on ? '#F5F6F6' : '#2B2E2D',
        dot: P[label],
        pick: () => this.setState({ prio: label })
      };
    });
    return {
      heading: edit ? 'Edit Task' : 'Create Task',
      cta: edit ? 'Save changes' : 'Create Task',
      assignee: this.state.assignee,
      onAssignee: (e) => this.setState({ assignee: e.target.value }),
      status: this.state.status,
      onStatus: (e) => this.setState({ status: e.target.value }),
      title: this.state.title,
      onTitle: (e) => this.setState({ title: e.target.value }),
      titleErr,
      titleBorder: titleErr ? '#B3361A' : 'transparent',
      desc: this.state.desc,
      descLen: this.state.desc.length,
      onDesc: (e) => this.setState({ desc: e.target.value }),
      due: edit ? '6 Oct 2026, 09:00' : '28 Sep 2026, 17:00',
      dueErr,
      dueColor: dueErr ? '#B3361A' : '#2B2E2D',
      dueTile: dueErr ? '#F2D9D1' : '#F1F2F2',
      dueIcon: dueErr ? '#9A2A10' : '#2B2E2D',
      prios
    };
  }
}
</script>
</body>
</html>
