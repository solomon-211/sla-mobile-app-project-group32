<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tempo · Sign In</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B2E2D}a:hover{color:#000}
.t-mask{overflow:hidden;display:block}
.t-rise{display:block;animation:t-rise .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes t-rise{from{transform:translateY(110%)}to{transform:translateY(0)}}
.t-pop{animation:t-pop .7s cubic-bezier(.2,.9,.25,1.25) both}
@keyframes t-pop{from{opacity:0;transform:translateY(18px) scale(.85)}to{opacity:1;transform:none}}
.t-up{animation:t-up .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes t-up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.t-field{transition:border-color .2s}
.t-field:focus-within{border-color:#2B2E2D}
.t-btn{transition:scale .15s ease}
.t-btn:active{scale:.96}
.t-btn .t-arrow{transition:width .35s cubic-bezier(.65,0,.35,1)}
.t-btn:hover .t-arrow{width:72px}
.t-nudge{animation:t-nudge 2.4s ease-in-out 1.4s infinite}
@keyframes t-nudge{0%,70%,100%{transform:translateX(0)}80%{transform:translateX(5px)}90%{transform:translateX(-1px)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #E6E8E7; font-family: Manrope, sans-serif; color: #2B2E2D">

<a href="Landing.dc.html" aria-label="Back" class="t-up" style="position: absolute; top: 20px; left: 16px; width: 46px; height: 46px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B2E2D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
</a>

<div style="position: absolute; top: 104px; left: 24px; right: 24px; display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-family: Sora, sans-serif; font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -1.2px">
<span class="t-mask"><span class="t-rise" style="animation-delay: .1s">Welcome back</span></span>
</h1>
<span class="t-mask"><span class="t-rise" style="font-size: 15px; line-height: 22px; font-weight: 500; color: #535856; animation-delay: .2s">Sign in to track your team's tasks.</span></span>
</div>

<form style="position: absolute; left: 20px; right: 20px; top: 208px; display: flex; flex-direction: column; gap: 12px; margin: 0">
<label class="t-up t-field" style="display: flex; align-items: center; gap: 12px; height: 58px; padding: 0 18px; border-radius: 20px; background: #FFFFFF; border: 1.5px solid #2B2E2D; box-sizing: border-box; animation-delay: .3s">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5F6462" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M3 7l9 6 9-6"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Email</span>
<input type="email" value="amina@devteam.app" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: 600 15px Manrope, sans-serif; color: #2B2E2D">
</label>
<label class="t-up t-field" style="display: flex; align-items: center; gap: 12px; height: 58px; padding: 0 8px 0 18px; border-radius: 20px; background: #FFFFFF; border: 1.5px solid transparent; box-sizing: border-box; animation-delay: .38s">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5F6462" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="3"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Password</span>
<input type="{{pwType}}" placeholder="Password" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: 500 15px Manrope, sans-serif; color: #2B2E2D">
<button type="button" aria-label="Show password" onClick="{{togglePw}}" style="width: 44px; height: 44px; border: 0; border-radius: 14px; background: #F1F2F2; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B2E2D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
</button>
</label>
<a href="Dashboard.dc.html" class="t-up t-btn" style="display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 8px 0 26px; border-radius: 999px; background: #2B2E2D; color: #F5F6F6; text-decoration: none; font-weight: 800; font-size: 16px; box-shadow: 0 12px 30px rgba(43,46,45,.22); margin-top: 8px; animation-delay: .46s">
Sign In
<span class="t-arrow" style="width: 48px; height: 48px; border-radius: 999px; background: #6F8F5E; display: flex; align-items: center; justify-content: center">
<svg class="t-nudge" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#121A0D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</span>
</a>
</form>

<div class="t-up" style="position: absolute; left: 0; right: 0; bottom: 28px; text-align: center; font-size: 14px; font-weight: 500; color: #5F6462; animation-delay: 1s">
New to the team? <a href="Register.dc.html" style="font-weight: 800; color: #2B2E2D">Create account</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { showPw: false };
  }
  renderVals() {
    return {
      pwType: this.state.showPw ? 'text' : 'password',
      togglePw: () => this.setState({ showPw: !this.state.showPw })
    };
  }
}
</script>
</body>
</html>
